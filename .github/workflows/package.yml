name: Package & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Restore
        run: dotnet restore

      - name: Build Release
        run: dotnet build --no-restore --configuration Release /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Publish self-contained
        run: >
          dotnet publish src/Wheelhouse.UI/Wheelhouse.UI.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/
          /p:Version=${{ steps.version.outputs.VERSION }}
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Create portable ZIP
        run: Compress-Archive -Path publish/* -DestinationPath Wheelhouse-${{ steps.version.outputs.VERSION }}-portable.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Wheelhouse-${{ steps.version.outputs.VERSION }}-portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
